<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450">
      <stop stop-color="#080715"/>
      <stop offset="1" stop-color="#180b22"/>
    </linearGradient>
    <linearGradient id="a" x1="250" y1="100" x2="550" y2="360">
      <stop stop-color="#f472b6"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="55"/></filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="170" cy="90" r="170" fill="#f472b6" opacity=".13" filter="url(#blur)"/>
  <circle cx="650" cy="390" r="180" fill="#a855f7" opacity=".15" filter="url(#blur)"/>
  <g opacity=".12" stroke="#94a3b8">
    <path d="M0 90h800M0 180h800M0 270h800M0 360h800"/>
    <path d="M100 0v450M200 0v450M300 0v450M400 0v450M500 0v450M600 0v450M700 0v450"/>
  </g>
  <g opacity=".6">
    {Array.from({ length: 8 }).map((_, row) =>
      Array.from({ length: 14 }).map((_, col) => (
        <rect
          key={`${row}-${col}`}
          x={60 + col * 50}
          y={70 + row * 42}
          width="46"
          height="38"
          rx="6"
          fill={(row + col) % 3 === 0 ? "#ffffff" : "#a855f7"}
          fill-opacity={(row + col) % 3 === 0 ? ".03" : ".02"}
          stroke="#ffffff"
          stroke-opacity=".04"
        />
      )),
    )}
  </g>
  <g transform="translate(400 228)">
    <ellipse cx="0" cy="28" rx="112" ry="94" fill="#0a0a1a" stroke="url(#a)" stroke-opacity=".55" stroke-width="3"/>
    <path d="M-78-40l-8-64 54 30M78-40l8-64-54 30" fill="#0a0a1a" stroke="url(#a)" stroke-opacity=".55" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-50-8l24 10M50-8l-24 10" stroke="#f9a8d4" stroke-width="10" stroke-linecap="round"/>
    <ellipse cx="-32" cy="14" rx="18" ry="12" fill="#f472b6" fill-opacity=".25"/>
    <ellipse cx="32" cy="14" rx="18" ry="12" fill="#f472b6" fill-opacity=".25"/>
    <circle cx="-32" cy="14" r="6" fill="#fbcfe8"/>
    <circle cx="32" cy="14" r="6" fill="#fbcfe8"/>
    <path d="M-14 46h28l-14 14-14-14Z" fill="#a855f7" fill-opacity=".65"/>
    <path d="M-42 64h84M-28 74h56" stroke="#ffffff" stroke-opacity=".18" stroke-width="3" stroke-linecap="round"/>
    <path d="M88 32l80 56" stroke="#f9a8d4" stroke-width="7" stroke-linecap="round" opacity=".7"/>
    <path d="M160 80l24 26-34-10" fill="#f472b6" fill-opacity=".5"/>
  </g>
  <g transform="translate(120 360)">
    <rect width="160" height="14" rx="7" fill="#ffffff" fill-opacity=".06"/>
    <path d="M0 7h112" stroke="#f472b6" stroke-width="14" stroke-linecap="round"/>
    <text x="122" y="11" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="8" font-weight="700">HP</text>
  </g>
  <g transform="translate(570 90)">
    <rect width="112" height="32" rx="16" fill="#a855f7" fill-opacity=".12" stroke="#a855f7" stroke-opacity=".35"/>
    <text x="18" y="20" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1">DUNGEON</text>
  </g>
  <g transform="translate(580 350)" opacity=".7">
    <path d="M0 0l14 10v18l-14 10-14-10V10L0 0Z" fill="#f472b6" fill-opacity=".2" stroke="#f9a8d4" stroke-opacity=".4"/>
    <path d="M0 18v30M-12 26l12 6 12-6" stroke="#f9a8d4" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
