        const y = Math.floor(i / 7) * 44;
        const done = [3, 5, 10, 12, 17, 18, 24].includes(i);
        return (
          <rect key={i} x={x} y={y + 46} width="32" height="32" rx="8" fill={done ? "#fbbf24" : "#ffffff"} fill-opacity={done ? ".16" : ".025"} stroke={done ? "#fbbf24" : "#ffffff"} stroke-opacity={done ? ".35" : ".05"}/>
